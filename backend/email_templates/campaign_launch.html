<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr><td style="padding:28px 32px;">
      <p style="margin:0 0 16px;font-size:13px;font-weight:bold;color:#2563eb;">${campaign_name}</p>
      <p style="margin:0 0 16px;font-size:15px;">Hi ${first_name},</p>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">The <strong>${campaign_name}</strong> campaign has started. You have <strong>${open_count} ${evaluation_word}</strong> to complete.</p>
      <p style="margin:0 0 24px;font-size:14px;color:#52606d;">Deadline: <strong>${deadline}</strong></p>
      <a href="${link}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#2563eb;color:#ffffff;font-size:14px;font-weight:bold;text-decoration:none;">Open my evaluations</a>
      <p style="margin:28px 0 0;font-size:14px;">Thank you,<br>${sender_name}</p>
    </td></tr>
  </table>
</body>
</html>
