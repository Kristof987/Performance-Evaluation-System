server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every asset name, so assets can be cached for good.
    # A missing asset must stay a real 404 instead of falling back to the app.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: every other path (e.g. /campaigns/5 after a refresh or from a shared link)
    # is served index.html, and React Router shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry page, so a new deployment is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
