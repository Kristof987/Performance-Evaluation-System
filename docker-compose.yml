services:
  db:
    image: postgres:17
    container_name: performance-evaluation-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: performance-evaluation-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      COMPASS_ENV: development
      COMPASS_DEV_LOGIN_ENABLED: "true"
      APP_TIMEZONE: Europe/Budapest
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL}

    depends_on:
      - db

  lifecycle-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["python", "-m", "campaign_lifecycle_worker"]
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_TIMEZONE: Europe/Budapest
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    environment:
      VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
      VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}

    container_name: performance-evaluation-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
