name: Deploy to Azure

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

env:
  RESOURCE_GROUP: perfeval-rg
  CONTAINER_ENVIRONMENT: perfeval-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # BRANCH-SPECIFIC NAMES
      # --------------------------------------------------

      - name: Generate deployment names
        id: names
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME,,}"

          SAFE_BRANCH=$(echo "$BRANCH" \
            | sed 's/[^a-z0-9-]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//' \
            | cut -c1-15)

          BRANCH_HASH=$(echo -n "$GITHUB_REF_NAME" \
            | sha1sum \
            | cut -c1-6)

          BACKEND_APP="pf-be-${SAFE_BRANCH}-${BRANCH_HASH}"
          FRONTEND_APP="pf-fe-${SAFE_BRANCH}-${BRANCH_HASH}"

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          BACKEND_IMAGE="ghcr.io/${OWNER}/perfeval-backend:${GITHUB_SHA}"
          FRONTEND_IMAGE="ghcr.io/${OWNER}/perfeval-frontend:${GITHUB_SHA}"

          echo "backend_app=$BACKEND_APP" >> "$GITHUB_OUTPUT"
          echo "frontend_app=$FRONTEND_APP" >> "$GITHUB_OUTPUT"

          echo "backend_image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"

          echo "Branch: $GITHUB_REF_NAME"
          echo "Backend app: $BACKEND_APP"
          echo "Frontend app: $FRONTEND_APP"


      # --------------------------------------------------
      # LOGIN TO GHCR
      # --------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------
      # LOGIN TO AZURE
      # --------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------
      # DATABASE MIGRATIONS
      # ONLY MAIN CHANGES SHARED DB SCHEMA
      # --------------------------------------------------

      - name: Run Alembic migrations
        if: github.ref_name == 'main'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          alembic upgrade head


      # --------------------------------------------------
      # BUILD BACKEND
      # --------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -t "${{ steps.names.outputs.backend_image }}" \
            ./backend


      # --------------------------------------------------
      # PUSH BACKEND
      # --------------------------------------------------

      - name: Push backend Docker image
        run: |
          docker push "${{ steps.names.outputs.backend_image }}"


      # --------------------------------------------------
      # DEPLOY BACKEND
      # --------------------------------------------------

      - name: Deploy backend to Azure Container Apps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        shell: bash
        run: |
          APP="${{ steps.names.outputs.backend_app }}"
          IMAGE="${{ steps.names.outputs.backend_image }}"

          if az containerapp show \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              >/dev/null 2>&1; then

            echo "Backend exists. Updating..."

            az containerapp secret set \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --secrets \
                "database-url=$DATABASE_URL"

            az containerapp registry set \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --server ghcr.io \
              --username "$GHCR_USERNAME" \
              --password "$GHCR_PAT"

            az containerapp update \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                "DATABASE_URL=secretref:database-url"

          else

            echo "Creating backend..."

            az containerapp create \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENVIRONMENT" \
              --image "$IMAGE" \
              --ingress external \
              --target-port 8000 \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" \
              --registry-password "$GHCR_PAT" \
              --secrets \
                "database-url=$DATABASE_URL" \
              --env-vars \
                "DATABASE_URL=secretref:database-url"

          fi


      # --------------------------------------------------
      # GET BACKEND URL
      # --------------------------------------------------

      - name: Get backend URL
        id: backend-url
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name "${{ steps.names.outputs.backend_app }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          BACKEND_URL="https://$FQDN"

          echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $BACKEND_URL"


      # --------------------------------------------------
      # BUILD FRONTEND
      # BACKEND URL IS INSERTED BY VITE AT BUILD TIME
      # --------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ steps.backend-url.outputs.url }}" \
            -t "${{ steps.names.outputs.frontend_image }}" \
            ./frontend


      # --------------------------------------------------
      # PUSH FRONTEND
      # --------------------------------------------------

      - name: Push frontend Docker image
        run: |
          docker push "${{ steps.names.outputs.frontend_image }}"


      # --------------------------------------------------
      # DEPLOY FRONTEND
      # --------------------------------------------------

      - name: Deploy frontend to Azure Container Apps
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        shell: bash
        run: |
          APP="${{ steps.names.outputs.frontend_app }}"
          IMAGE="${{ steps.names.outputs.frontend_image }}"

          if az containerapp show \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              >/dev/null 2>&1; then

            echo "Frontend exists. Updating..."

            az containerapp registry set \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --server ghcr.io \
              --username "$GHCR_USERNAME" \
              --password "$GHCR_PAT"

            az containerapp update \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"

          else

            echo "Creating frontend..."

            az containerapp create \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENVIRONMENT" \
              --image "$IMAGE" \
              --ingress external \
              --target-port 80 \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --registry-server ghcr.io \
              --registry-username "$GHCR_USERNAME" \
              --registry-password "$GHCR_PAT"

          fi


      # --------------------------------------------------
      # GET FRONTEND URL
      # --------------------------------------------------

      - name: Get frontend URL
        id: frontend-url
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name "${{ steps.names.outputs.frontend_app }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          FRONTEND_URL="https://$FQDN"

          echo "url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "Frontend URL: $FRONTEND_URL"


      # --------------------------------------------------
      # CONFIGURE BACKEND CORS
      # --------------------------------------------------

      - name: Configure backend frontend URL
        run: |
          az containerapp update \
            --name "${{ steps.names.outputs.backend_app }}" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "FRONTEND_URL=${{ steps.frontend-url.outputs.url }}"


      # --------------------------------------------------
      # DEPLOYMENT SUMMARY
      # --------------------------------------------------

      - name: Deployment summary
        shell: bash
        run: |
          echo "## PerfEval Azure deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Branch:** \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Frontend:** ${{ steps.frontend-url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Backend:** ${{ steps.backend-url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Backend docs:** ${{ steps.backend-url.outputs.url }}/docs" >> "$GITHUB_STEP_SUMMARY"